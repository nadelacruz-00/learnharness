# LearnHarness remote server, Tailscale variant (fork).
# Copy to /opt/stacks/learnharness-ts/compose.yml, with ./tailscale/serve.json
# next to it and a checkout of the fork in ./src. See
# docs/remote-server-tailscale.md.
#
# Reached only over the tailnet: the `tailscale` sidecar joins the tailnet as
# its own machine and `tailscale serve` (serve.json) proxies
# https://<TS_HOSTNAME>.<tailnet>.ts.net to http://127.0.0.1:3000. The app
# shares the sidecar's network namespace and listens on 127.0.0.1 only, so
# no other container and no host process can reach it or forge the
# Tailscale-User-Login header. No "ports:" anywhere.
name: learnharness-ts
services:
  tailscale:
    # Official image, pinned (v1.104.7, multi-arch index digest, 2026-11-12).
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    container_name: learnharness-ts
    hostname: learnharness
    restart: unless-stopped
    environment:
      # Only needed for the first start; the node key then lives in ts-state.
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${TS_HOSTNAME:-learnharness}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      # Userspace networking: no /dev/net/tun, no NET_ADMIN. Serve still works.
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
    volumes:
      - ts-state:/var/lib/tailscale
      - ./tailscale:/config:ro   # the directory, not the file (live reload)
    mem_limit: 256m
    # no "ports:" section

  app:
    # Build from a checkout of the fork at a release commit; pin the tag.
    build:
      context: ./src
    image: learnharness:0.6.1-tailscale.1
    container_name: learnharness-ts-app
    restart: unless-stopped
    # Share the sidecar's network namespace: 127.0.0.1 here is the sidecar's
    # loopback, and the app has no network interface of its own.
    network_mode: service:tailscale
    depends_on: [tailscale]
    env_file: app.env       # LH_SERVER_MODE, LH_TAILSCALE_ALLOWED_LOGINS, LH_PUBLIC_ORIGIN
    environment:
      HOSTNAME: 127.0.0.1   # loopback only; remote mode refuses anything else
    volumes:
      - data:/data          # /data/data (learning data), /data/auth.json (API keys)
    mem_limit: 1g

volumes:
  ts-state: {}
  data: {}
